# Render blueprint — deploy this folder as one web service.
#
# Either point Render at this repo (it reads render.yaml automatically) or create
# a Web Service by hand with the same three commands:
#   build:  npm ci && npm run build
#   start:  npm start
#   health: /health
services:
  - type: web
    name: vega-backend
    runtime: node
    plan: free
    # Singapore is the closest region to India, where this is used from.
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # NOT declared here on purpose: AUTH_SECRET, API_KEY, CLIENT_SECRET.
      #
      # Render prompts for the value of every `sync: false` variable when the
      # Blueprint is created, and there is no "optional" flag — so declaring
      # these would ask for values that must stay *empty*. They must stay empty
      # because the API counts as open only while all three are (see `open:` in
      # src/lib/auth.ts), and the app cannot sign a request yet: filling any one
      # of them locks every route with nothing able to get back in.
      #
      # Nothing is lost by leaving them out. An absent variable and an empty one
      # are the same thing to this code — `trimmed()` in that same file turns
      # both into ''.
      #
      # When the app ships the matching secret, add all of them here together:
      #   - key: AUTH_SECRET
      #     generateValue: true
      #   - key: CLIENT_SECRET      # must equal the app's compiled secret
      #     sync: false
      #   - key: CLIENT_SECRETS     # optional: id:secret,id:secret to rotate
      #     sync: false
      #
      # Vedu (time:token) pairs from a current app build, comma separated. This
      # is required for Vedu playback: nothing is baked into the code any more,
      # because a captured pair is a credential. Vedu gates playback per build,
      # so a retired capture shows as listing: true, playback: false on
      # /api/vedu/status. See the README.
      - key: VEDU_AUTH_PAIRS
        sync: false
