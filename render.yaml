# Render blueprint — deploy this folder as one web service.
#
# Either point Render at this repo (it reads render.yaml automatically) or create
# a Web Service by hand with the same three commands:
#   build:  npm ci && npm run build
#   start:  npm start
#   health: /health
services:
  - type: web
    name: vega-backend
    runtime: node
    plan: free
    # Singapore is the closest region to India, where this is used from.
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # The old flat key. Leave unset and the deployment is open to anyone who
      # knows the URL; set it here (Render keeps the value, not this file) and
      # every call needs ?key=... or an x-api-key header.
      - key: API_KEY
        sync: false

      # Signs the short-lived tokens this service hands out. Render generates it
      # once and keeps it; no need to invent or paste one.
      - key: AUTH_SECRET
        generateValue: true

      # The app's shared secret — the one that signs a request to
      # /api/auth/token. Render cannot invent this one: it has to match what is
      # compiled into the app. Paste it here (or set CLIENT_SECRETS instead, as
      # id:secret,id:secret, to keep an old and a new secret alive at once while
      # the app is updated).
      - key: CLIENT_SECRET
        sync: false
      # Vedu (time:token) pairs from a current app build, comma separated. This
      # is required for Vedu playback: nothing is baked into the code any more,
      # because a captured pair is a credential. Vedu gates playback per build,
      # so a retired capture shows as listing: true, playback: false on
      # /api/vedu/status. See the README.
      - key: VEDU_AUTH_PAIRS
        sync: false
